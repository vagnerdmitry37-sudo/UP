  Build:
    runs-on: ubuntu-latest
    environment: Dev

    # needs: Integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -f UP.Api/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/up-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/up-api:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/up-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/up-api:latest
    